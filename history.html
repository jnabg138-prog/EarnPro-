<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; margin: 0; font-family: sans-serif; }
        .history-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .type-icon {
            width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 16px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pending { background: #eab308; color: #000; }
        .status-approved { background: #22c55e; color: #fff; }
        .status-rejected { background: #ef4444; color: #fff; }
        .status-completed { background: #38bdf8; color: #fff; } 
    </style>
</head>
<body>
    <div id="loader" style="position: fixed; inset: 0; background: #0f172a; color: #38bdf8; display: flex; justify-content: center; align-items: center; z-index: 9999;">
        <i class="fa-solid fa-circle-notch fa-spin"></i> &nbsp; Loading Transactions...
    </div>

    <nav class="navbar" style="display: flex; align-items: center; padding: 15px; background: #1e293b;">
        <a href="index.html" style="color: #38bdf8; text-decoration: none; margin-right: 15px;"><i class="fa-solid fa-arrow-left"></i></a>
        <div style="font-weight: bold; color: #fff;">Transaction History</div>
    </nav>

    <div class="container" style="padding: 20px;">
        <div id="historyList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const phone = localStorage.getItem("userPhone") || localStorage.getItem("currentUser");

        if(!phone) { 
            window.location.href = 'login.html'; 
        } else {
            loadHistory();
        }

        function loadHistory() {
            const depRef = ref(db, 'deposits');
            const withPendingRef = ref(db, 'withdrawRequests');
            const withDoneRef = ref(db, 'withdrawHistory');

            // Aik saath listen karne ke liye nested structure with null safety
            onValue(depRef, (snapshot) => {
                const depData = snapshot.val() || {};
                
                onValue(withPendingRef, (pSnapshot) => {
                    const pData = pSnapshot.val() || {};
                    
                    onValue(withDoneRef, (dSnapshot) => {
                        const dData = dSnapshot.val() || {};
                        
                        let allTransactions = [];

                        // 1. Deposits filter
                        Object.values(depData).forEach(item => {
                            if(item.phone === phone || item.user === phone) {
                                allTransactions.push({...item, type: 'Deposit'});
                            }
                        });

                        // 2. Pending Withdrawals filter
                        Object.values(pData).forEach(item => {
                            if(item.phone === phone) {
                                allTransactions.push({...item, type: 'Withdraw', status: item.status || 'Pending'});
                            }
                        });

                        // 3. Completed Withdrawals filter
                        Object.values(dData).forEach(item => {
                            if(item.phone === phone) {
                                allTransactions.push({...item, type: 'Withdraw', status: 'Completed'});
                            }
                        });

                        // Sort latest first
                        allTransactions.sort((a, b) => {
                            const dateA = new Date(a.date || a.time);
                            const dateB = new Date(b.date || b.time);
                            return dateB - dateA;
                        });

                        displayHistory(allTransactions);
                    });
                });
            });
        }

        function displayHistory(data) {
            const container = document.getElementById("historyList");
            const loader = document.getElementById("loader");
            container.innerHTML = "";
            
            if(data.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; color:#64748b; margin-top:50px;">
                        <i class="fa-solid fa-folder-open" style="font-size: 40px; margin-bottom: 10px;"></i>
                        <p>No transaction history found.</p>
                    </div>`;
            } else {
                data.forEach(item => {
                    const isDep = item.type === 'Deposit';
                    const statusClass = "status-" + (item.status ? item.status.toLowerCase() : "pending");
                    const icon = isDep ? "fa-arrow-down" : "fa-arrow-up";
                    const iconColor = isDep ? "#22c55e" : "#ef4444";
                    const amountPrefix = isDep ? "+" : "-";

                    container.innerHTML += `
                        <div class="history-card">
                            <div style="display: flex; align-items: center;">
                                <div class="type-icon" style="background: ${iconColor}22; color: ${iconColor};">
                                    <i class="fa-solid ${icon}"></i>
                                </div>
                                <div>
                                    <h4 style="margin: 0; color: #fff;">${amountPrefix} Rs. ${parseInt(item.amount).toLocaleString()}</h4>
                                    <p style="margin: 3px 0 0; font-size: 11px; color: #94a3b8;">
                                        ${isDep ? 'Deposit (TID: ' + (item.trxId || item.tid || 'N/A') + ')' : 'Withdrawal to ' + (item.method || 'Wallet')}
                                    </p>
                                    <p style="margin: 2px 0 0; font-size: 10px; color: #64748b;"><i class="fa-solid fa-calendar-days"></i> ${item.date || item.time}</p>
                                </div>
                            </div>
                            <div>
                                <span class="status-badge ${statusClass}">${item.status || "Pending"}</span>
                            </div>
                        </div>
                    `;
                });
            }
            // Loader ko hamesha band hona chahiye data milne ke baad
            loader.style.display = "none";
        }
    </script>
</body>
    </html>
