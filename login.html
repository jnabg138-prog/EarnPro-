<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
            <i class="fa-solid fa-right-to-bracket" style="font-size: 50px; color: #38bdf8; margin-bottom: 20px;"></i>
            <h2>Welcome Back</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 25px;">Login to manage your EarnPro account</p>

            <div style="text-align: left;">
                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Mobile Number</label>
                <input type="number" id="loginPhone" placeholder="03XXXXXXXXX">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Password</label>
                <input type="password" id="loginPass" placeholder="Enter password">
            </div>

            <button id="loginBtn" onclick="login()" style="margin-top: 20px; background: #38bdf8; color: #0f172a; font-weight: bold;">
                Login Account
            </button>

            <p style="margin-top: 20px; font-size: 14px; color: #94a3b8;">
                Don't have an account? <a href="signup.html" style="color: #38bdf8; text-decoration: none; font-weight: bold;">Sign Up</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.login = function() {
            const phone = document.getElementById("loginPhone").value.trim();
            const pass = document.getElementById("loginPass").value.trim();
            const btn = document.getElementById("loginBtn");

            if(!phone || !pass) {
                alert("Please enter both mobile number and password!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Authenticating...";

            const userRef = ref(db, 'users/' + phone);
            get(userRef).then((snapshot) => {
                if(snapshot.exists()) {
                    const userData = snapshot.val();
                    if(userData.pass === pass) {
                        localStorage.setItem("currentUser", phone);
                        alert("Login Successful!");
                        window.location.href = 'index.html';
                    } else {
                        alert("Incorrect Password!");
                        btn.disabled = false;
                        btn.innerHTML = "Login Account";
                    }
                } else {
                    alert("User not found! Please sign up first.");
                    btn.disabled = false;
                    btn.innerHTML = "Login Account";
                }
            }).catch((err) => {
                alert("Database Error: " + err.message);
                btn.disabled = false;
                btn.innerHTML = "Login Account";
            });
        }
    </script>
</body>
</html>
