<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-arrow-left"></i> Back
        </div>
        <div class="logo">Withdraw Profit</div>
        <div></div>
    </nav>

    <div class="card" style="margin-top: 40px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <i class="fa-solid fa-money-bill-transfer" style="font-size: 50px; color: #38bdf8;"></i>
        </div>
        
        <h3>Withdraw Your Earnings</h3>
        <p style="font-size: 13px; color: #94a3b8;">Minimum Withdraw: <b>Rs. 2,500</b></p>

        <div style="text-align: left; margin-top: 20px;">
            <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Withdraw Amount</label>
            <input type="number" id="wAmount" placeholder="Enter Amount (e.g. 2500)">
            
            <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Select Method</label>
            <select id="wMethod" style="width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
                <option value="JazzCash">JazzCash</option>
                <option value="EasyPaisa">EasyPaisa</option>
            </select>

            <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Account Number</label>
            <input type="text" id="wNumber" placeholder="Your Mobile Account Number">
        </div>

        <button id="withdrawBtn" onclick="handleWithdraw()" style="margin-top: 20px; background: #22c55e; color: white;">
            Confirm Withdrawal
        </button>

        <p id="note" style="font-size: 11px; color: #ef4444; margin-top: 15px; display: none;">
            * Investment is required to enable withdrawals.
        </p>
    </div>

    <script>
        function handleWithdraw() {
            const amount = parseInt(document.getElementById("wAmount").value);
            const number = document.getElementById("wNumber").value;
            const method = document.getElementById("wMethod").value;
            const btn = document.getElementById("withdrawBtn");
            const phone = localStorage.getItem("currentUser");
            const user = JSON.parse(localStorage.getItem("user_" + phone));

            // 1. Shart: Deposit check (Plan "Free" nahi hona chahiye)
            if (user.plan === "Free") {
                alert("Withdrawal Error: Please upgrade your plan first to enable withdrawals!");
                document.getElementById("note").style.display = "block";
                return;
            }

            // 2. Shart: Minimum Limit 2500
            if (!amount || amount < 2500) {
                alert("Minimum withdrawal limit is Rs. 2,500");
                return;
            }

            // 3. Shart: Balance check
            if (user.balance < amount) {
                alert("Insufficient balance! Your current balance is Rs. " + user.balance);
                return;
            }

            if (!number) {
                alert("Please enter your account number!");
                return;
            }

            // Sab theek hai toh process karein
            btn.disabled = true;
            btn.innerHTML = 'Processing...';

            // History mein pending request dalna
            let history = JSON.parse(localStorage.getItem("transHistory") || "[]");
            history.push({
                user: phone,
                type: "Withdraw",
                amount: amount,
                number: number,
                method: method,
                status: "Pending",
                date: new Date().toLocaleString()
            });
            localStorage.setItem("transHistory", JSON.stringify(history));

            // User ka balance deduct karna
            user.balance -= amount;
            localStorage.setItem("user_" + phone, JSON.stringify(user));

            setTimeout(() => {
                // English message jesa aapne kaha
                alert("Your withdrawal request has been submitted successfully. It will be completed within 24 hours.");
                window.location.href = "index.html";
            }, 2000);
        }
    </script>
</body>
</html>
