<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0b1329;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid #1e293b;
            padding: 14px 12px;
            text-align: left;
        }
        .admin-table th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: 600;
        }
        .admin-table tr:nth-child(even) { background-color: #0f172a; }
        .admin-table tr:nth-child(odd) { background-color: #131e3a; }
        
        .approve-btn {
            background: #22c55e; color: #fff; border: none; padding: 6px 12px;
            border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .approve-btn:hover { background: #16a34a; }
        
        .reject-btn {
            background: #ef4444; color: #fff; border: none; padding: 6px 12px;
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; transition: 0.2s;
        }
        .reject-btn:hover { background: #dc2626; }
        
        .status-badge {
            padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px;
        }
    </style>
</head>
<body>
    <nav class="navbar" style="background: #0f172a; border-bottom: 1px solid #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div class="logo" style="font-weight: bold; font-size: 18px; color: #38bdf8;"><i class="fa-solid fa-lock"></i> EarnPro Control Room</div>
        <div style="font-size: 13px; color: #deff9a; background: rgba(222, 255, 154, 0.1); padding: 4px 10px; border-radius: 20px;">Logged in as Admin</div>
    </nav>

    <div class="container" style="padding: 25px; max-width: 1200px; margin: 0 auto;">
        <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 5px;">Pending Deposit Requests</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Verify TIDs and amounts before clicking approve. Data syncs live with users.</p>

        <div style="overflow-x: auto; background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User Mobile</th>
                        <th>Amount</th>
                        <th>TID (Transaction ID)</th>
                        <th>Date & Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="depositRequestsTable">
                    <tr>
                        <td colspan='6' style='text-align:center; color:#64748b; padding: 20px;'>Loading database requests...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        // Firebase Configuration (Same as your app configuration)
        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🔥 Updated package structural layout matching your 4 New Plans
        function determinePlanName(amount) {
            const amt = parseInt(amount);
            if (amt === 2000) return "Basic Plan";
            if (amt === 10000) return "Standard Plan";
            if (amt === 25000) return "Premium Plan";
            if (amt === 75000) return "Ultimate Plan";
            return "Free";
        }

        // Live fetch deposit data from Firebase
        const depositsRef = ref(db, 'deposits');
        onValue(depositsRef, (snapshot) => {
            const tableBody = document.getElementById("depositRequestsTable");
            tableBody.innerHTML = ""; // Clear existing table entries
            
            const data = snapshot.val();
            if(!data) {
                tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#64748b; padding: 20px;'>No deposit requests found!</td></tr>";
                return;
            }

            let pendingCount = 0;

            // Loop through all items inside 'deposits' node
            Object.keys(data).forEach((key) => {
                const item = data[key];
                
                // Show only requests which are strictly "Pending"
                if(item.status === "Pending") {
                    pendingCount++;
                    
                    // 🔥 KEY RE-FIXING AREA: Matching exactly with deposit.html structure
                    const userMobile = item.phone || "N/A";
                    const depositAmount = item.amount || 0;
                    const transactionId = item.trxId || "N/A";  // Using 'trxId' instead of 'tid'
                    const dateTime = item.time || "N/A";        // Using 'time' instead of 'date'
                    
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><b style="color: #e2e8f0;">${userMobile}</b></td>
                        <td style="color:#22c55e; font-weight:bold; font-size: 14px;">Rs. ${parseInt(depositAmount).toLocaleString()}</td>
                        <td style="letter-spacing:0.5px; color:#38bdf8; font-weight: 600;">${transactionId}</td>
                        <td style="color:#94a3b8;">${dateTime}</td>
                        <td><span class="status-badge" style="background:#eab308; color:#000;">${item.status}</span></td>
                        <td>
                            <button class="approve-btn" onclick="actionDeposit('${key}', '${userMobile}', ${depositAmount}, 'Approved')">
                                <i class="fa-solid fa-check"></i> Approve
                            </button>
                            <button class="reject-btn" onclick="actionDeposit('${key}', '${userMobile}', ${depositAmount}, 'Rejected')">
                                <i class="fa-solid fa-xmark"></i> Reject
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                }
            });

            if(pendingCount === 0) {
                tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#64748b; padding: 20px;'>🎉 All requests are processed! No pending data.</td></tr>";
            }
        });

        // Core business logic: Approve or Reject Action Engine
        window.actionDeposit = function(reqId, userPhone, amount, finalStatus) {
            if(!confirm(`Are you sure you want to mark this request as ${finalStatus}?`)) return;

            // 1. Update the status of the deposit node item itself
            const specificDepRef = ref(db, 'deposits/' + reqId);
            update(specificDepRef, { status: finalStatus }).then(() => {
                
                // Also update user's internal transaction history logs status
                const historyRef = ref(db, 'history/' + userPhone + '/' + reqId);
                update(historyRef, { status: finalStatus });
                
                if(finalStatus === "Approved") {
                    // 2. Fetch target user profile node to update balance, plan parameters
                    const userRef = ref(db, 'users/' + userPhone);
                    get(userRef).then((userSnapshot) => {
                        if(userSnapshot.exists()) {
                            const userObj = userSnapshot.val();
                            
                            let currentBalance = parseInt(userObj.balance || 0);
                            let newBalance = currentBalance + parseInt(amount);
                            let matchedPlan = determinePlanName(amount);

                            // Update operational fields inside user object
                            let updates = {};
                            updates['balance'] = newBalance;
                            updates['plan'] = matchedPlan;
                            updates['tasksDone'] = 0; // Reset task counter back to 0 on new plan activation

                            // 3. Referral Commission Logic Engine
                            if(userObj.referredBy && userObj.referredBy !== "NONE" && userObj.referredBy !== "") {
                                const parentCode = userObj.referredBy;
                                
                                const allUsersRef = ref(db, 'users');
                                get(allUsersRef).then((allSnapshot) => {
                                    if(allSnapshot.exists()) {
                                        const usersList = allSnapshot.val();
                                        Object.keys(usersList).forEach((bossPhone) => {
                                            if(usersList[bossPhone].myCode === parentCode) {
                                                // Awarding permanent reward tasks boost to the referrer
                                                let currentBonus = parseInt(usersList[bossPhone].bonusTasks || 0);
                                                let currentDaily = parseInt(usersList[bossPhone].dailyTasks || 2);
                                                
                                                let bossUpdates = {};
                                                bossUpdates['bonusTasks'] = currentBonus + 2;
                                                bossUpdates['dailyTasks'] = currentDaily + 2;

                                                update(ref(db, 'users/' + bossPhone), bossUpdates);
                                            }
                                        });
                                    }
                                });
                            }

                            // Commit data modifications back live to target user node
                            update(userRef, updates).then(() => {
                                alert(`Request Successfully Approved!\nRs. ${amount} added to user balance and ${matchedPlan} activated.`);
                            });
                        }
                    });
                } else {
                    alert("Request rejected successfully.");
                }
            }).catch((err) => {
                alert("Database Sync Error: " + err.message);
            });
        }
    </script>
</body>
</html>
