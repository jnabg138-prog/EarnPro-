<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnPro Super Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b1329; --card: #0f172a; --border: #1e293b; --text: #f8fafc; --primary: #38bdf8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        
        /* Login Overlay */
        #adminAuth { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 15px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        
        /* Main Dashboard */
        .dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        
        /* Search & Stats Section */
        .search-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 10px; margin-bottom: 30px; }
        input, select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0b1329; color: white; outline: none; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #0f172a; }
        
        /* User Edit Panel */
        .edit-panel { background: var(--card); border: 1px solid var(--primary); border-radius: 12px; padding: 25px; margin-bottom: 30px; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
        
        .table-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--primary); background: rgba(56, 189, 248, 0.05); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. Admin Login Shield -->
    <div id="adminAuth">
        <div class="auth-card">
            <i class="fa-solid fa-shield-halved" style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"></i>
            <h2>Admin Access</h2>
            <p style="color: #94a3b8; font-size: 14px; margin: 10px 0 20px;">Enter security key to manage EarnPro</p>
            <input type="password" id="adminPass" placeholder="Enter Admin Password..." style="width: 100%; margin-bottom: 15px;">
            <button onclick="checkAdmin()" class="btn btn-primary" style="width: 100%;">Unlock Dashboard</button>
        </div>
    </div>

    <!-- 2. Main Dashboard Content -->
    <div class="dashboard" id="mainDashboard">
        <div class="nav">
            <h2><i class="fa-solid fa-gauge-high"></i> EarnPro Super Admin</h2>
            <button onclick="location.reload()" class="btn" style="background: #ef4444; color: white;">Logout</button>
        </div>

        <!-- Global Search Bar (Phone ya TID search karein) -->
        <div class="search-box">
            <input type="text" id="globalSearch" placeholder="Search by User Phone or Transaction ID (TID)...">
            <button onclick="searchEverything()" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        </div>

        <!-- Hidden User Edit Panel (Search ke baad khulega) -->
        <div id="userEditPanel" class="edit-panel">
            <h3 id="editTitle">Edit User: Loading...</h3>
            <div class="grid">
                <div><label>Balance (Rs.)</label><input type="number" id="upBalance"></div>
                <div><label>Daily Tasks</label><input type="number" id="upTasks"></div>
                <div>
                    <label>Account Plan</label>
                    <select id="upPlan">
                        <option value="Free">Free</option>
                        <option value="Basic Plan">Basic Plan</option>
                        <option value="Standard Plan">Standard Plan</option>
                        <option value="Premium Plan">Premium Plan</option>
                        <option value="Ultimate Plan">Ultimate Plan</option>
                    </select>
                </div>
            </div>
            <button onclick="commitUserUpdate()" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-save"></i> Save All Changes</button>
        </div>

        <!-- Pending Deposits Table -->
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Pending Deposit Requests</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Amount</th>
                        <th>TID</th>
                        <th>Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="depositTable"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- 1. Login Logic ---
        window.checkAdmin = function() {
            const pass = document.getElementById("adminPass").value;
            if(pass === "786786") { // Apna password yahan set karein
                document.getElementById("adminAuth").style.display = "none";
                document.getElementById("mainDashboard").style.display = "block";
                loadPendingDeposits();
            } else {
                alert("Wrong Admin Password!");
            }
        }

        // --- 2. Live Pending Deposits ---
        function loadPendingDeposits() {
            onValue(ref(db, 'deposits'), (snapshot) => {
                const tbody = document.getElementById("depositTable");
                tbody.innerHTML = "";
                const data = snapshot.val();
                if(!data) return;

                Object.keys(data).forEach(key => {
                    const item = data[key];
                    if(item.status === "Pending") {
                        tbody.innerHTML += `
                            <tr>
                                <td><b>${item.phone}</b></td>
                                <td style="color:#22c55e;">Rs. ${item.amount}</td>
                                <td style="color:#38bdf8;">${item.trxId}</td>
                                <td>${item.time}</td>
                                <td>
                                    <button class="btn btn-primary" style="padding:5px 10px;" onclick="approveDep('${key}', '${item.phone}', ${item.amount})">Approve</button>
                                </td>
                            </tr>`;
                    }
                });
            });
        }

        // --- 3. Powerful Global Search (Phone or TID) ---
        window.searchEverything = function() {
            const query = document.getElementById("globalSearch").value.trim();
            if(!query) return alert("Kuch likhen search karne ke liye!");

            // Pehle check karein agar ye Phone Number hai
            get(ref(db, 'users/' + query)).then((snap) => {
                if(snap.exists()) {
                    showEditPanel(query, snap.val());
                } else {
                    // Agar phone nahi mila, to Deposits mein TID search karein
                    get(ref(db, 'deposits')).then((depSnap) => {
                        let foundPhone = null;
                        const deposits = depSnap.val();
                        Object.values(deposits).forEach(d => {
                            if(d.trxId === query) foundPhone = d.phone;
                        });

                        if(foundPhone) {
                            get(ref(db, 'users/' + foundPhone)).then(s => showEditPanel(foundPhone, s.val()));
                        } else {
                            alert("No user or TID found!");
                        }
                    });
                }
            });
        }

        function showEditPanel(phone, data) {
            document.getElementById("userEditPanel").style.display = "block";
            document.getElementById("editTitle").innerText = "Editing User: " + phone;
            document.getElementById("upBalance").value = data.balance || 0;
            document.getElementById("upTasks").value = data.dailyTasks || 2;
            document.getElementById("upPlan").value = data.plan || "Free";
            // Save phone globally to use in update
            window.activeEditPhone = phone;
            window.scrollTo(0,0);
        }

        window.commitUserUpdate = function() {
            const phone = window.activeEditPhone;
            const updates = {
                balance: parseInt(document.getElementById("upBalance").value),
                dailyTasks: parseInt(document.getElementById("upTasks").value),
                plan: document.getElementById("upPlan").value
            };
            update(ref(db, 'users/' + phone), updates).then(() => {
                alert("User updated successfully!");
                document.getElementById("userEditPanel").style.display = "none";
            });
        }

        window.approveDep = function(id, phone, amt) {
            if(!confirm("Approve this payment?")) return;
            update(ref(db, 'deposits/' + id), { status: "Approved" });
            get(ref(db, 'users/' + phone)).then(s => {
                const cur = s.val().balance || 0;
                update(ref(db, 'users/' + phone), { balance: cur + parseInt(amt) });
                alert("Payment Approved & Balance Added!");
            });
        }
    </script>
</body>
                                                        </html>
