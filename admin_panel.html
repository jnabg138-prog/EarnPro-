<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid #334155;
            padding: 12px 10px;
            text-align: left;
        }
        .admin-table th {
            background-color: #1e293b;
            color: #38bdf8;
        }
        .admin-table tr:nth-child(even) { background-color: #0f172a; }
        .approve-btn {
            background: #22c55e; color: #fff; border: none; padding: 5px 10px;
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .reject-btn {
            background: #ef4444; color: #fff; border: none; padding: 5px 10px;
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px;
        }
        .status-badge {
            padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-lock"></i> EarnPro Control Room</div>
        <div style="font-size: 12px; color: #deff9a;">Logged in as Admin</div>
    </nav>

    <div class="container" style="padding: 15px; max-width: 100%;">
        <h2>Pending Deposit Requests</h2>
        <p style="color: #94a3b8; font-size: 12px;">Verify TIDs and amounts before clicking approve.</p>

        <div style="overflow-x: auto;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User Mobile</th>
                        <th>Amount</th>
                        <th>TID (Transaction ID)</th>
                        <th>Date & Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="depositRequestsTable">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Map amount to proper VIP Plan Name
        function determinePlanName(amount) {
            const amt = parseInt(amount);
            if (amt === 1500) return "VIP 1";
            if (amt === 3000) return "VIP 2";
            if (amt === 5000) return "VIP 3";
            if (amt === 10000) return "VIP 4";
            if (amt === 25000) return "VIP 5";
            if (amt === 50000) return "VIP 6";
            if (amt === 75000) return "VIP 7";
            if (amt === 100000) return "VIP 8";
            if (amt === 150000) return "VIP 9";
            if (amt === 200000) return "VIP 10";
            if (amt === 225000) return "VIP 11";
            if (amt === 250000) return "VIP 12";
            return "Free";
        }

        // Live fetch deposit data from Firebase
        const depositsRef = ref(db, 'deposits');
        onValue(depositsRef, (snapshot) => {
            const tableBody = document.getElementById("depositRequestsTable");
            tableBody.innerHTML = ""; // Clear existing rows
            
            const data = snapshot.val();
            if(!data) {
                tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#64748b;'>No deposit requests found!</td></tr>";
                return;
            }

            // Loop through all items
            Object.keys(data).forEach((key) => {
                const item = data[key];
                
                // Show only Pending or display everything
                if(item.status === "Pending") {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><b>${item.user}</b></td>
                        <td style="color:#22c55e; font-weight:bold;">Rs. ${parseInt(item.amount).toLocaleString()}</td>
                        <td style="letter-spacing:1px; color:#38bdf8;">${item.tid}</td>
                        <td style="color:#94a3b8;">${item.date}</td>
                        <td><span class="status-badge" style="background:#eab308; color:#000;">${item.status}</span></td>
                        <td>
                            <button class="approve-btn" onclick="actionDeposit('${key}', '${item.user}', ${item.amount}, 'Approved')">Approve</button>
                            <button class="reject-btn" onclick="actionDeposit('${key}', '${item.user}', ${item.amount}, 'Rejected')">Reject</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                }
            });

            if(tableBody.innerHTML === "") {
                tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#64748b;'>All requests are processed!</td></tr>";
            }
        });

        // Core business logic: Approve or Reject Action
        window.actionDeposit = function(reqId, userPhone, amount, finalStatus) {
            if(!confirm(`Are you sure you want to mark this request as ${finalStatus}?`)) return;

            // 1. Update the status of the deposit request itself
            const specificDepRef = ref(db, 'deposits/' + reqId);
            update(specificDepRef, { status: finalStatus }).then(() => {
                
                if(finalStatus === "Approved") {
                    // 2. Fetch target user to update balance, plan and handle team bonuses
                    const userRef = ref(db, 'users/' + userPhone);
                    get(userRef).then((userSnapshot) => {
                        if(userSnapshot.exists()) {
                            const userObj = userSnapshot.val();
                            
                            let currentBalance = parseInt(userObj.balance || 0);
                            let newBalance = currentBalance + parseInt(amount);
                            let matchedPlan = determinePlanName(amount);

                            // Update properties
                            let updates = {};
                            updates['balance'] = newBalance;
                            updates['plan'] = matchedPlan;

                            // 3. Referral Logic: Check if user was referred by a "Boss"
                            if(userObj.referredBy && userObj.referredBy !== "NONE" && userObj.referredBy !== "") {
                                const parentCode = userObj.referredBy;
                                
                                // Search all users for matching unique invitation code
                                const allUsersRef = ref(db, 'users');
                                get(allUsersRef).then((allSnapshot) => {
                                    if(allSnapshot.exists()) {
                                        const usersList = allSnapshot.val();
                                        Object.keys(usersList).forEach((bossPhone) => {
                                            if(usersList[bossPhone].myCode === parentCode) {
                                                // Found the referrer! Add +2 tasks permanently
                                                let currentBonus = parseInt(usersList[bossPhone].bonusTasks || 0);
                                                let currentDaily = parseInt(usersList[bossPhone].dailyTasks || 2);
                                                
                                                let bossUpdates = {};
                                                bossUpdates['bonusTasks'] = currentBonus + 2;
                                                bossUpdates['dailyTasks'] = currentDaily + 2; // Immediate task boost

                                                update(ref(db, 'users/' + bossPhone), bossUpdates);
                                                console.log("Permanent +2 tasks credited to Boss code: " + parentCode);
                                            }
                                        });
                                    }
                                });
                            }

                            // Commit updates for the user who deposited
                            update(userRef, updates).then(() => {
                                alert(`Request Successfully Approved!\nRs. ${amount} added and ${matchedPlan} activated.`);
                            });
                        }
                    });
                } else {
                    alert("Request rejected successfully.");
                }
            }).catch((err) => {
                alert("Error: " + err.message);
            });
        }
    </script>
</body>
</html>
