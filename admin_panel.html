<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnPro Super Admin - Final Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b1329; --card: #0f172a; --border: #1e293b; --text: #f8fafc; --primary: #38bdf8; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; font-family: 'Inter', sans-serif; }
        #adminAuth { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 15px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        .dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 11px; margin-right: 5px; text-transform: uppercase; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--primary); margin-bottom: 5px; font-weight: bold; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; background: #0b1329; border: 1px solid var(--border); color: white; border-radius: 6px; }
        .table-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; margin-top: 20px; margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--primary); }
        .no-data { text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div id="adminAuth">
        <div class="auth-card">
            <h2>Admin Security Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Password..." style="width: 100%; margin: 20px 0; padding: 12px; border-radius: 8px; background: #0b1329; color: white; border: 1px solid var(--border); text-align: center;">
            <button onclick="checkAdmin()" class="btn btn-primary" style="width: 100%; padding: 12px;">Unlock</button>
        </div>
    </div>

    <div class="dashboard" id="mainDashboard">
        <div class="nav">
            <h2><i class="fa-solid fa-crown" style="color: var(--warning);"></i> EarnPro Master Admin</h2>
            <button onclick="location.reload()" class="btn btn-danger">Logout</button>
        </div>

        <h3 style="color:var(--primary);">User Search & Manage</h3>
        <div style="background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px;">
            <input type="text" id="searchPhone" placeholder="Enter Phone Number...">
            <button onclick="searchAndEdit()" class="btn btn-primary">Search User</button>
        </div>

        <div id="editSection" style="background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: none; border: 1px solid var(--primary);">
            <h3 style="color:var(--primary); margin-bottom:15px;">Edit Details: <span id="targetPhone"></span></h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group"><label>Balance (PKR)</label><input type="number" id="eBal"></div>
                <div class="form-group"><label>Daily Tasks Limit</label><input type="number" id="eDaily"></div>
                <div class="form-group"><label>Bonus Tasks</label><input type="number" id="eBonus"></div>
                <div class="form-group"><label>Total Invites</label><input type="number" id="eInv"></div>
                <div class="form-group"><label>Referral Bonus</label><input type="number" id="eRefBonus"></div>
                <div class="form-group"><label>Team Size</label><input type="number" id="eTeam"></div>
            </div>
            <button onclick="saveChanges()" class="btn btn-success" style="width: 100%; padding: 12px; margin-top:10px;">Save All Changes</button>
        </div>

        <h3 style="color:var(--primary); margin-top:40px;">Pending Deposit Requests</h3>
        <div class="table-container">
            <table>
                <thead><tr><th>Phone</th><th>Date/Time</th><th>TID</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="depositBody"></tbody>
            </table>
        </div>

        <h3 style="color:var(--primary); margin-top:40px;">Pending Withdrawal Requests</h3>
        <div class="table-container">
            <table>
                <thead><tr><th>Phone</th><th>Date/Time</th><th>Number</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="withdrawBody"></tbody>
            </table>
        </div>

        <h3 style="color:var(--primary); margin-top:40px;">Send Notifications</h3>
        <div class="table-container">
            <table>
                <thead><tr><th>User Phone</th><th>Notification Text</th><th>Action</th></tr></thead>
                <tbody id="userListBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, update, get, onValue, remove, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentPhone = "";

        window.checkAdmin = () => {
            if(document.getElementById("adminPass").value === "786786") {
                document.getElementById("adminAuth").style.display = "none";
                document.getElementById("mainDashboard").style.display = "block";
                loadRequests();
                loadUsersForNotif();
            } else { alert("Wrong Password!"); }
        }

        function loadRequests() {
            onValue(ref(db, 'deposits/'), (snap) => {
                const body = document.getElementById("depositBody");
                body.innerHTML = "";
                let count = 0;
                snap.forEach(child => {
                    const req = child.val();
                    if(req.phone && req.time && req.tid && req.amount) {
                        body.innerHTML += `<tr><td>${req.phone}</td><td>${req.time}</td><td>${req.tid}</td><td>${req.amount}</td><td>Pending</td><td><button class="btn btn-success" onclick="approveDeposit('${child.key}', '${req.phone}', ${req.amount})">Accept</button><button class="btn btn-danger" onclick="remove(ref(db, 'deposits/${child.key}'))">Reject</button></td></tr>`;
                        count++;
                    }
                });
                if(count === 0) body.innerHTML = "<tr><td colspan='6' class='no-data'>No more requests</td></tr>";
            });

            onValue(ref(db, 'withdrawRequests/'), (snap) => {
                const body = document.getElementById("withdrawBody");
                body.innerHTML = "";
                let count = 0;
                snap.forEach(child => {
                    const req = child.val();
                    if(req.status === "Pending") {
                        body.innerHTML += `<tr><td>${req.phone || 'N/A'}</td><td>${req.date || 'N/A'}</td><td>${req.number || 'N/A'}</td><td>${req.amount || 0}</td><td>${req.status}</td><td><button class="btn btn-success" onclick="remove(ref(db, 'withdrawRequests/${child.key}'))">Paid</button><button class="btn btn-danger" onclick="remove(ref(db, 'withdrawRequests/${child.key}'))">Reject</button></td></tr>`;
                        count++;
                    }
                });
                if(count === 0) body.innerHTML = "<tr><td colspan='6' class='no-data'>No more requests</td></tr>";
            });
        }

        function loadUsersForNotif() {
            onValue(ref(db, 'users/'), (snap) => {
                const body = document.getElementById("userListBody");
                body.innerHTML = "";
                if(snap.exists()){
                    snap.forEach(child => {
                        const phone = child.key;
                        // یہاں مکمل لسٹ شو ہو رہی ہے
                        body.innerHTML += `<tr><td>${phone}</td><td><input type="text" id="notif_${phone}" placeholder="Enter message..."></td><td><button class="btn btn-primary" onclick="sendNotif('${phone}')">Submit</button></td></tr>`;
                    });
                }
            });
        }

        window.sendNotif = (phone) => {
            const msg = document.getElementById(`notif_${phone}`).value;
            if(!msg) return alert("Enter message!");
            set(ref(db, 'notifications/' + phone), { text: msg, status: 'unread' });
            alert("Notification Sent!");
        }

        window.approveDeposit = (key, phone, amount) => {
            get(ref(db, 'users/' + phone)).then(snap => {
                if(snap.exists()){
                    const currentBal = parseInt(snap.val().balance || 0);
                    update(ref(db, 'users/' + phone), { balance: currentBal + amount });
                    remove(ref(db, 'deposits/' + key));
                    alert("Approved Successfully!");
                }
            });
        }

        window.searchAndEdit = () => {
            const phone = document.getElementById("searchPhone").value;
            get(ref(db, 'users/' + phone)).then(snap => {
                if(!snap.exists()) return alert("User not found!");
                const u = snap.val();
                currentPhone = phone;
                document.getElementById("targetPhone").innerText = phone;
                document.getElementById("eBal").value = u.balance || 0;
                document.getElementById("eDaily").value = u.dailyTasks || 0; 
                document.getElementById("eBonus").value = u.bonusTasks || 0;
                document.getElementById("eInv").value = u.totalInvites || 0;
                document.getElementById("eRefBonus").value = u.referralBonus || 0;
                document.getElementById("eTeam").value = u.teamSize || 0;
                document.getElementById("editSection").style.display = "block";
            });
        }

        window.saveChanges = () => {
            update(ref(db, 'users/' + currentPhone), { 
                balance: parseInt(document.getElementById("eBal").value),
                dailyTasks: parseInt(document.getElementById("eDaily").value),
                bonusTasks: parseInt(document.getElementById("eBonus").value),
                totalInvites: parseInt(document.getElementById("eInv").value),
                referralBonus: parseInt(document.getElementById("eRefBonus").value),
                teamSize: parseInt(document.getElementById("eTeam").value)
            }).then(() => { alert("Updated Successfully!"); });
        }
    </script>
</body>
                                                                        </html>
