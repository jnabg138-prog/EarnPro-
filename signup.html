<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center; background: #0f172a; padding: 30px; border-radius: 15px; border: 1px solid #1e293b;">
            <i class="fa-solid fa-user-plus" style="font-size: 50px; color: #38bdf8; margin-bottom: 20px;"></i>
            <h2 style="margin-bottom: 10px; color: white;">Create Account</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 25px;">Join EarnPro & Start Earning Today</p>

            <div style="text-align: left;">
                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Full Name</label>
                <input type="text" id="newName" placeholder="Ex: John Doe" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #1e293b; background: #0b1329; color: white;">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Mobile Number</label>
                <input type="number" id="newPhone" placeholder="03XXXXXXXXX" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #1e293b; background: #0b1329; color: white;">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Password</label>
                <input type="password" id="newPass" placeholder="Enter password" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #1e293b; background: #0b1329; color: white;">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Referral Code (Auto-Detected)</label>
                <input type="text" id="refBy" placeholder="No Referral" style="text-transform: uppercase; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; background: #1e293b; color: #38bdf8; font-weight: bold;" readonly>
                <small style="color: #64748b; font-size: 10px; margin-left: 5px;">Referral code link se khud detect ho jata hai.</small>
            </div>

            <button id="signupBtn" style="margin-top: 25px; background: #38bdf8; color: #0f172a; font-weight: bold; width: 100%; padding: 14px; border-radius: 8px; border: none; cursor: pointer;">
                Register Account
            </button>

            <p style="margin-top: 20px; font-size: 14px; color: #94a3b8;">
                Already have an account? <a href="login.html" style="color: #38bdf8; text-decoration: none; font-weight: bold;">Login</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🔥 URL se referral code "EP-XXXX" nikalne ka logic
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById("refBy").value = refCode.toUpperCase();
                console.log("Referral Detected: " + refCode);
            }
        };

        document.getElementById("signupBtn").addEventListener("click", () => {
            const name = document.getElementById("newName").value.trim();
            const phone = document.getElementById("newPhone").value.trim();
            const pass = document.getElementById("newPass").value.trim();
            const refBy = document.getElementById("refBy").value.trim() || "NONE";
            const btn = document.getElementById("signupBtn");

            if(!name || !phone || !pass) {
                alert("Please fill all fields!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Creating Account...";

            const userRef = ref(db, 'users/' + phone);
            
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    alert("This phone number is already registered!");
                    btn.disabled = false;
                    btn.innerHTML = "Register Account";
                } else {
                    // Unique Code for NEW user (for their own referrals)
                    const myNewCode = "EP-" + phone.slice(-4) + Math.floor(10 + Math.random() * 90);

                    set(userRef, {
                        name: name,
                        phone: phone,
                        pass: pass,
                        balance: 0,
                        plan: "Free",
                        myCode: myNewCode,
                        referredBy: refBy, // Link wala code yahan save hoga
                        dailyTasks: 2,
                        bonusTasks: 0,
                        tasksDone: 0,
                        lastTaskDate: ""
                    }).then(() => {
                        alert("Account Created Successfully!\nYour Invite Code: " + myNewCode);
                        window.location.href = 'login.html';
                    }).catch((error) => {
                        alert("Database Error: " + error.message);
                        btn.disabled = false;
                        btn.innerHTML = "Register Account";
                    });
                }
            }).catch((error) => {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerHTML = "Register Account";
            });
        });
    </script>
</body>
</html>
