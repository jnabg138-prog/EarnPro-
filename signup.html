<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
            <i class="fa-solid fa-user-plus" style="font-size: 50px; color: #38bdf8; margin-bottom: 20px;"></i>
            <h2 style="margin-bottom: 10px;">Create Account</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 25px;">Join EarnPro & Start Earning</p>

            <div style="text-align: left;">
                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Full Name</label>
                <input type="text" id="newName" placeholder="Ex: John Doe">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Mobile Number</label>
                <input type="number" id="newPhone" placeholder="03XXXXXXXXX">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Password</label>
                <input type="password" id="newPass" placeholder="Enter password">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Referral Code (Optional)</label>
                <input type="text" id="refBy" placeholder="Example: EP-A1B2" style="text-transform: uppercase;">
            </div>

            <button id="signupBtn" style="margin-top: 20px; background: #38bdf8; color: #0f172a; font-weight: bold;">
                Register Account
            </button>

            <p style="margin-top: 20px; font-size: 14px; color: #94a3b8;">
                Already have an account? <a href="login.html" style="color: #38bdf8; text-decoration: none; font-weight: bold;">Login</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Click Event Listener setup kiya taake type="module" mein function direct chal sake
        document.getElementById("signupBtn").addEventListener("click", () => {
            const name = document.getElementById("newName").value.trim();
            const phone = document.getElementById("newPhone").value.trim();
            const pass = document.getElementById("newPass").value.trim();
            const refBy = document.getElementById("refBy").value.trim().toUpperCase();
            const btn = document.getElementById("signupBtn");

            if(!name || !phone || !pass) {
                alert("Jani, saari details bharna zaroori hain!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Processing...";

            const userRef = ref(db, 'users/' + phone);
            
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    alert("Ye number pehle se register hai!");
                    btn.disabled = false;
                    btn.innerHTML = "Register Account";
                } else {
                    // Unique Referral Code Generator (English + Math)
                    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                    let uniqueCode = 'EP-';
                    for (let i = 0; i < 4; i++) {
                        uniqueCode += chars.charAt(Math.floor(Math.random() * chars.length));
                    }

                    // Save data to Firebase Realtime Database
                    set(userRef, {
                        name: name,
                        phone: phone,
                        pass: pass,
                        balance: 0,
                        plan: "Free",
                        myCode: uniqueCode,
                        referredBy: refBy || "None",
                        dailyTasks: 2,
                        bonusTasks: 0
                    }).then(() => {
                        alert("Mubarak ho! Account ban gaya hai.\n\nApka Invite Code: " + uniqueCode);
                        window.location.href = 'login.html';
                    }).catch((error) => {
                        alert("Database Error: " + error.message);
                        btn.disabled = false;
                        btn.innerHTML = "Register Account";
                    });
                }
            }).catch((error) => {
                alert("Error checking user: " + error.message);
                btn.disabled = false;
                btn.innerHTML = "Register Account";
            });
        });
    </script>
</body>
</html>
