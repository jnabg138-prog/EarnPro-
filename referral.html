<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refer & Earn - EarnPro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { color: #58a6ff; margin-bottom: 25px; font-size: 24px; }
        .code-box { background: #0d1117; border: 2px dashed #30363d; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        .code-box p { font-size: 12px; color: #8b949e; letter-spacing: 1px; margin-bottom: 10px; }
        .code-box h1 { font-size: 32px; color: #38bdf8; letter-spacing: 2px; margin-bottom: 15px; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background: #0ea5e9; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { background: #21262d; border: 1px solid #30363d; padding: 15px; border-radius: 8px; }
        .stat-card h3 { font-size: 24px; color: #38bdf8; margin-bottom: 5px; }
        .stat-card p { font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Refer & Earn</h2>
        
        <div class="code-box">
            <p>YOUR UNIQUE CODE</p>
            <h1 id="myUniqueCode">Generating...</h1>
            <button onclick="copyRef()" class="btn">🔗 Copy Link</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalInvites">0</h3>
                <p>Total Invites</p>
            </div>
            <div class="stat-card">
                <h3 id="permBonus">0</h3>
                <p>Permanent Tasks</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="script.js"></script>
    
    <script>
        // LocalStorage se login phone ਨੰਬਰ nikalna
        const phone = localStorage.getItem("currentUser");

        if (!phone) {
            alert("Pehle login karein!");
            window.location.href = "login.html";
        } else {
            // INSTANT CODE GENERATION (Bina database ka wait kiye)
            // Phone number ke aakhri 6 numbers uthana
            const lastSixDigits = phone.slice(-6); 
            const myInstantCode = "EP-" + lastSixDigits;
            
            // Screen par foran dikha do
            document.getElementById("myUniqueCode").innerText = myInstantCode;

            // Background mein database se baki data (Invites/Bonus) load hota rahega, screen nahi rukegi
            const userRef = firebase.database().ref("users/" + phone);
            userRef.on("value", (snapshot) => {
                const user = snapshot.val();
                if (user) {
                    document.getElementById("permBonus").innerText = user.bonusTasks || 0;
                    
                    // Agar database mein code save nahi hai toh background mein save bhi kar dega
                    if(!user.myCode) {
                        userRef.update({ myCode: myInstantCode });
                    }

                    // Total Invites count karna
                    firebase.database().ref("users").once("value", (allUsersSnapshot) => {
                        let count = 0;
                        allUsersSnapshot.forEach((childSnapshot) => {
                            const u = childSnapshot.val();
                            if (u.referredBy === myInstantCode) {
                                count++;
                            }
                        });
                        document.getElementById("totalInvites").innerText = count;
                    });
                }
            });
        }

        // Link Copy karne ka full alert system
        function copyRef() {
            const codeText = document.getElementById("myUniqueCode").innerText;
            if(codeText === "Generating...") {
                alert("Pehle code generate hone dein!");
                return;
            }
            
            const link = "https://jnabg138-prog.github.io/EarnPro-/signup.html?ref=" + codeText;
            
            navigator.clipboard.writeText(link).then(() => {
                alert("Mubarak ho! Referral link copy ho gaya hai:\n\n" + link);
            }).catch(err => {
                alert("Is link ko manually copy kar lein:\n\n" + link);
            });
        }
    </script>
</body>
</html>
