<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refer & Earn - EarnPro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0b1329; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 25px; font-size: 24px; font-weight: 700; }
        .code-box { background: #0b1329; border: 2px dashed #334155; border-radius: 8px; padding: 20px; margin-bottom: 25px; transition: 0.3s; }
        .code-box:hover { border-color: #38bdf8; }
        .code-box p { font-size: 11px; color: #94a3b8; letter-spacing: 1.5px; margin-bottom: 10px; }
        .code-box h1 { font-size: 32px; color: #ffffff; letter-spacing: 2px; margin-bottom: 15px; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2); }
        .btn:hover { background: #0ea5e9; transform: translateY(-2px); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 10px; }
        .stat-card h3 { font-size: 24px; color: #38bdf8; margin-bottom: 5px; font-weight: 800; }
        .stat-card p { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .back-link { display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link" style="text-align: left; margin-bottom: 10px; display: inline-block; width: 100%;">← Back to Dashboard</a>
        <h2>Refer & Earn</h2>
        
        <div class="code-box">
            <p>YOUR UNIQUE REFERRAL CODE</p>
            <h1 id="myUniqueCode">EP-LOADING</h1>
            <button onclick="copyRef()" class="btn">🔗 Copy Referral Link</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalInvites">0</h3>
                <p>Total Invites</p>
            </div>
            <div class="stat-card">
                <h3 id="permBonus">0</h3>
                <p>Bonus Tasks</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 2. User Authentication Check
        const phone = localStorage.getItem("userPhone") || localStorage.getItem("currentUser");

        if (!phone) {
            alert("Session expire ho gaya! Pehle login karein.");
            window.location.href = "login.html";
        } else {
            const lastSixDigits = phone.toString().slice(-6); 
            const myInstantCode = "EP-" + lastSixDigits;
            
            document.getElementById("myUniqueCode").innerText = myInstantCode;

            const userRef = db.ref("users/" + phone);
            
            userRef.on("value", (snapshot) => {
                const user = snapshot.val();
                if (user) {
                    document.getElementById("permBonus").innerText = user.bonusTasks || 0;
                    
                    if (!user.myCode || user.myCode !== myInstantCode) {
                        userRef.update({ myCode: myInstantCode });
                    }

                    // Scan System: تمام یوزرز کو اسکین کر کے ٹوٹل انوائٹس کاؤنٹ کرنا
                    db.ref("users").once("value", (allUsersSnapshot) => {
                        let count = 0;
                        allUsersSnapshot.forEach((childSnapshot) => {
                            const u = childSnapshot.val();
                            if (u.referredBy === myInstantCode) {
                                count++;
                            }
                        });
                        document.getElementById("totalInvites").innerText = count;
                    });
                }
            });
        }

        // 3. Smart Link Copy System (Handles Sub-folders and File Names perfectly)
        function copyRef() {
            const codeText = document.getElementById("myUniqueCode").innerText;
            if(codeText === "EP-LOADING") {
                alert("Thora intezar karein, code load ho raha hai...");
                return;
            }
            
            // Poora current URL lein (e.g., https://jnabg138-prog.github.io/EarnPro/refer.html)
            let currentUrl = window.location.href;
            
            // Agar URL ke aakhri mein query parameters hain (? se aagay) toh unhe saaf karein
            if (currentUrl.indexOf("?") > -1) {
                currentUrl = currentUrl.split("?")[0];
            }
            
            // Aakhri file ka naam nikal kar 'signup.html' se replace karein
            const lastSlashIndex = currentUrl.lastIndexOf("/");
            const basePath = currentUrl.substring(0, lastSlashIndex + 1);
            
            // Final path tayar: Yeh aapki repository ke folders ko automatically sath jore rakhega
            const link = basePath + "signup.html?ref=" + codeText;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    alert("Copy Ho Gaya! Apne doston ko invite karein:\n\n" + link);
                }).catch(err => {
                    fallbackCopy(link);
                });
            } else {
                fallbackCopy(link);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert("Referral link copy ho gaya!");
        }
    </script>
</body>
</html>
