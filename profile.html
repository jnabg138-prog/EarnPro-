<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; color: #38bdf8; display: flex; justify-content: center; align-items: center; z-index: 9999; font-weight: bold;">
        <i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 10px;"></i> Loading Profile...
    </div>

    <nav class="navbar" style="display: flex; align-items: center; padding: 15px; background: #1e293b;">
        <a href="index.html" style="color: #38bdf8; text-decoration: none; margin-right: 15px; font-size: 18px;"><i class="fa-solid fa-arrow-left"></i></a>
        <div style="font-weight: bold; color: #fff; font-size: 16px;">Account Settings</div>
    </nav>

    <div class="container" style="padding: 20px;">
        <div class="card" style="text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center;">
            
            <div style="position: relative; cursor: pointer;" onclick="document.getElementById('imageInput').click();">
                <div id="avatarCircle" style="width: 90px; height: 90px; border-radius: 50%; background: #0f172a; border: 3px solid #38bdf8; display: flex; justify-content: center; align-items: center; overflow: hidden;">
                    <i id="profGenderIcon" class="fa-solid fa-venus-mars" style="font-size: 40px; color: #38bdf8;"></i>
                    <img id="profileView" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                </div>
                <div style="position: absolute; bottom: 0; right: 0; background: #38bdf8; color: #000; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px;">
                    <i class="fa-solid fa-camera"></i>
                </div>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <p style="font-size: 10px; color: #94a3b8; margin: 5px 0 15px 0;">Tap circle to change photo</p>

            <h3 id="profName" style="color: #fff; margin: 5px 0 2px 0;">User Name</h3>
            <p id="profPhone" style="color: #94a3b8; font-size: 13px; margin: 0 0 10px 0;">03XXXXXXXXX</p>
            <span id="profPlan" class="vip-badge" style="background:#eab308; color:#000; padding:3px 12px; border-radius:12px; font-size:11px; font-weight: bold;">Free</span>
        </div>

        <div class="card" style="padding: 20px; border-radius: 12px; text-align: left; margin-bottom: 20px;">
            <h4 style="color: #fff; margin: 0 0 15px 0;"><i class="fa-solid fa-user-gear" style="color: #38bdf8; margin-right: 8px;"></i> Personal Details</h4>
            
            <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Select Gender</label>
            <select id="genderSelect" style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px; margin-bottom: 15px;">
                <option value="Not Set">Not Set</option>
                <option value="Male">Male ♂</option>
                <option value="Female">Female ♀</option>
                <option value="Other">Other</option>
            </select>

            <button id="saveProfileBtn" style="background: #22c55e; color: #fff; font-weight: bold;">
                Save Profile Details
            </button>
        </div>

        <div class="card" style="padding: 20px; border-radius: 12px; text-align: left;">
            <h4 style="color: #fff; margin: 0 0 15px 0;"><i class="fa-solid fa-key" style="color: #38bdf8; margin-right: 8px;"></i> Change Password</h4>
            
            <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Current Password</label>
            <input type="password" id="currPass" placeholder="Enter current password">

            <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">New Password</label>
            <input type="password" id="newPass" placeholder="Enter new password">

            <button id="updatePassBtn" style="background: #38bdf8; color: #0f172a; font-weight: bold; margin-top: 10px;">
                Update Password
            </button>
        </div>

        <button id="logoutBtn" style="background: #ef4444; color: #fff; font-weight: bold; margin-top: 20px; border: none;">
            <i class="fa-solid fa-right-from-bracket"></i> Logout Account
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const phone = localStorage.getItem("currentUser");

        if(!phone) {
            window.location.href = 'login.html';
        } else {
            const userRef = ref(db, 'users/' + phone);
            
            // Photo local storage load logic
            const savedPic = localStorage.getItem("userPic_" + phone);
            if(savedPic) {
                document.getElementById("profileView").src = savedPic;
                document.getElementById("profileView").style.display = "block";
                document.getElementById("profGenderIcon").style.display = "none";
            }

            // Load Data from Firebase
            get(userRef).then((snapshot) => {
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById("profName").innerText = data.name;
                    document.getElementById("profPhone").innerText = data.phone;
                    document.getElementById("profPlan").innerText = data.plan || "Free";
                    if(data.gender) { document.getElementById("genderSelect").value = data.gender; }

                    // Save Profile (Gender) Logic
                    document.getElementById("saveProfileBtn").addEventListener("click", () => {
                        const gender = document.getElementById("genderSelect").value;
                        update(userRef, { gender: gender }).then(() => {
                            alert("Profile successfully updated!");
                        });
                    });

                    // Password Update Logic
                    document.getElementById("updatePassBtn").addEventListener("click", () => {
                        const currPass = document.getElementById("currPass").value.trim();
                        const newPass = document.getElementById("newPass").value.trim();
                        if(data.pass !== currPass) { alert("Current password is wrong!"); return; }
                        if(newPass.length < 4) { alert("Password must be 4 chars!"); return; }
                        
                        update(userRef, { pass: newPass }).then(() => {
                            alert("Password changed! Please login again.");
                            localStorage.removeItem("currentUser");
                            window.location.href = 'login.html';
                        });
                    });
                }
                document.getElementById("loader").style.display = "none";
            });

            // Handle Local Image Upload
            document.getElementById("imageInput").addEventListener("change", function() {
                const file = this.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        localStorage.setItem("userPic_" + phone, e.target.result);
                        document.getElementById("profileView").src = e.target.result;
                        document.getElementById("profileView").style.display = "block";
                        document.getElementById("profGenderIcon").style.display = "none";
                        alert("Profile picture loaded successfully!");
                    }
                    reader.readAsDataURL(file);
                }
            });

            // Logout Logic
            document.getElementById("logoutBtn").addEventListener("click", () => {
                localStorage.removeItem("currentUser");
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
