<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .video-box { background: #1e293b; padding: 15px; border-radius: 15px; text-align: center; margin-top: 20px; }
        iframe { width: 100%; height: 200px; border-radius: 10px; border: none; }
        .timer { font-size: 24px; color: #fbbf24; margin: 15px 0; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="logo" onclick="window.location.href='index.html'">← Back</div><div class="logo">Daily Tasks</div><div></div></nav>
    <div class="card" style="margin-top: 80px;">
        <h3 id="p-name">Loading...</h3>
        <p id="t-count">Tasks: 0/0</p>
        <div class="video-box" id="v-area">
            <p id="r-text" style="color: #22c55e;">Reward: Rs. 0</p>
            <iframe src="https://www.youtube.com/embed/ScMzIvxBSi4"></iframe>
            <div class="timer" id="timer">Wait for Start</div>
            <button id="s-btn" onclick="start()" style="width: 100%; background: #22c55e;">Start Task</button>
            <button id="c-btn" onclick="claim()" style="width: 100%; background: #38bdf8; display: none;">Claim Reward</button>
        </div>
    </div>
    <script>
        let history = JSON.parse(localStorage.getItem("transactionHistory") || "[]");
        let deposit = history.find(item => item.type === "Deposit");
        let plan="Free", limit=2, reward=18, time=120;

        if(deposit) {
            reward=33; time=148;
            if(deposit.amount==500){plan="Basic"; limit=5;}
            else if(deposit.amount==1000){plan="Silver"; limit=7;}
            else if(deposit.amount==2000){plan="Golden"; limit=9;}
            else if(deposit.amount==5000){plan="Premium"; limit=13;}
        }

        let done = parseInt(localStorage.getItem("tasksDone") || "0");
        document.getElementById("p-name").innerText = plan + " Plan";
        document.getElementById("t-count").innerText = "Tasks: " + done + "/" + limit;
        document.getElementById("r-text").innerText = "Reward: Rs. " + reward;

        if(done >= limit) document.getElementById("v-area").innerHTML = "<h3>Limit Reached!</h3>";

        function start() {
            document.getElementById("s-btn").style.display = "none";
            let t = time;
            let cd = setInterval(() => {
                t--; document.getElementById("timer").innerText = t + "s";
                if(t<=0){ clearInterval(cd); document.getElementById("c-btn").style.display="block"; }
            }, 1000);
        }

        function claim() {
            let bal = parseInt(localStorage.getItem("myBalance") || 0);
            localStorage.setItem("myBalance", bal + reward);
            localStorage.setItem("tasksDone", done + 1);
            alert("Reward Added!"); window.location.href="index.html";
        }
    </script>
</body>
</html>
