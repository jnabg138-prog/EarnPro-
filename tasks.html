<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .video-box { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 15px; 
            text-align: center; 
            margin-top: 20px; 
        }
        iframe { 
            width: 100%; 
            height: 200px; 
            border-radius: 10px; 
            border: none; 
        }
        .timer { 
            font-size: 24px; 
            color: #fbbf24; 
            margin: 15px 0; 
            font-weight: bold;
        }
        /* Hidden Ad Container Box */
        #ad-frame-container {
            display: none;
            width: 100%;
            height: 300px;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #38bdf8;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">← Back</div>
        <div class="logo">Daily Tasks</div>
        <div></div>
    </nav>

    <div class="container">
        <div class="Card" style="margin-top: 80px;">
            <h3 id="p-name">Loading Plan...</h3>
            <p id="t-count">Tasks: 0/0</p>
            
            <div class="video-box" id="v-area">
                </div>
            
            <div id="ad-frame-container">
                <iframe id="ad-iframe" src="" style="width:100%; height:100%;"></iframe>
            </div>
            
            <div class="timer" id="timer">Wait for Start</div>
            
            <button id="s-btn" onclick="document.getElementById('ad-frame-container').style.display='block'; document.getElementById('ad-iframe').src='https://omg10.com/4/11022523'; start();" style="width: 100%; background: #22c55e; color: white; font-weight: bold;">Start Task</button>
            <button id="c-btn" onclick="claim()" style="width: 100%; background: #38bdf8; color: #0f172a; font-weight: bold; display: none;">Claim Reward</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="script.js"></script>

</body>
</html>
