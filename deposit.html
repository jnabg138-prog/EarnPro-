<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b1329; color: #ffffff; margin: 0; font-family: sans-serif; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #38bdf8; margin-bottom: 8px; font-weight: 600; }
        .modern-input {
            width: 100%; padding: 14px 16px; font-size: 15px; color: #ffffff !important;
            background-color: #1e293b !important; border: 2px solid #334155 !important;
            border-radius: 8px !important; outline: none; box-sizing: border-box;
        }
        .modern-input:focus { border-color: #38bdf8 !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .navbar { display: flex; justify-content: space-between; padding: 15px; background: #1e293b; position: fixed; top: 0; width: 100%; z-index: 100; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;"><i class="fa-solid fa-arrow-left"></i> Back</div>
        <div class="logo">Deposit Money</div>
        <div></div>
    </nav>

    <div class="container" style="margin-top: 80px; padding: 20px;">
        <div style="text-align: right; margin-bottom: 15px;">
            <button onclick="window.location.href='history.html'" style="background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 7px 16px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">
                <i class="fa-solid fa-clock-history"></i> Deposit Record
            </button>
        </div>

        <div class="card" style="text-align: center; padding: 25px 20px; border-radius: 12px; background: #0f172a; border: 1px solid #1e293b;">
            <i class="fa-solid fa-wallet" style="font-size: 44px; color: #38bdf8; margin-bottom: 15px;"></i>
            <h2 style="font-size: 20px; font-weight: 700;">Send Payment</h2>
            
            <div style="background: #1e293b; padding: 15px; border-radius: 10px; text-align: left; margin: 20px 0; border: 1px dashed #334155;">
                <p style="margin: 6px 0; font-size: 14px;"><strong style="color: #38bdf8;">Bank:</strong> JazzCash</p>
                <p style="margin: 6px 0; font-size: 14px;"><strong style="color: #38bdf8;">Number:</strong> 03266956534</p>
                <p style="margin: 6px 0; font-size: 14px;"><strong style="color: #38bdf8;">Title:</strong> Muhammad Amir</p>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-money-bill-wave"></i> Amount (PKR)</label>
                <input type="number" id="depAmount" class="modern-input" placeholder="Enter amount">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-receipt"></i> Transaction ID (TrxID)</label>
                <input type="text" id="depTrx" class="modern-input" placeholder="Enter 11-digit ID">
            </div>

            <button id="depBtn" style="background: #38bdf8; color: #0f172a; font-weight: 800; width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px;">
                Submit Request
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const phone = localStorage.getItem("currentUser") || localStorage.getItem("userPhone");

        // Plan Amount Auto-fill
        const selectedAmount = localStorage.getItem("selectedPlanAmount");
        if (selectedAmount) {
            document.getElementById("depAmount").value = selectedAmount;
        }

        // Click Event Handler
        document.getElementById("depBtn").addEventListener("click", async () => {
            const amount = document.getElementById("depAmount").value.trim();
            const trx = document.getElementById("depTrx").value.trim();
            const btn = document.getElementById("depBtn");

            if(!phone) {
                alert("Pehle login karein!");
                window.location.href = 'login.html';
                return;
            }

            if(!amount || !trx) {
                alert("Jani, saari details fill karo!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Submitting...";

            const timestamp = new Date().toLocaleString();
            const depRef = ref(db, 'deposits');
            const newDepRef = push(depRef); // Yeh uniquely key generate karega

            const depositData = {
                phone: phone,
                amount: parseInt(amount),
                trxId: trx,
                status: "Pending",
                time: timestamp,
                type: "Deposit"
            };

            try {
                // 1. Global node mein push karna (Taqay admin dekh sakay)
                await set(newDepRef, depositData);
                
                // 2. User ki apni personal history node mein copy save karna
                const userHistoryRef = ref(db, 'history/' + phone + '/' + newDepRef.key);
                await set(userHistoryRef, depositData);

                localStorage.removeItem("selectedPlanAmount");
                alert("Deposit request successfully submitted!");
                window.location.href = 'history.html';
            } catch (err) {
                alert("Firebase Error: " + err.message);
                btn.disabled = false;
                btn.innerHTML = "Submit Request";
            }
        });
    </script>
</body>
</html>
