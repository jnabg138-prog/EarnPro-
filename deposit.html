<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - EarnPro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">← Back</div>
        <div class="logo">Deposit Money</div>
        <div></div>
    </nav>

    <div class="container" style="margin-top: 80px; padding: 20px;">
        <div style="text-align: right; margin-bottom: 15px;">
            <button onclick="window.location.href='history.html'" style="background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 6px 14px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;">
                <i class="fa-solid fa-clock-history"></i> Deposit Record
            </button>
        </div>

        <div class="card" style="text-align: center; padding: 20px;">
            <i class="fa-solid fa-wallet" style="font-size: 40px; color: #38bdf8; margin-bottom: 15px;"></i>
            <h2>Send Payment</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Niche diye gaye account par paise send karke details submit karein.</p>

            <div style="background: #1e293b; padding: 15px; border-radius: 10px; text-align: left; margin-bottom: 20px; border: 1px dashed #334155;">
                <p style="margin: 5px 0; font-size: 14px;"><strong>Bank Name:</strong> EasyPaisa / JazzCash</p>
                <p style="margin: 5px 0; font-size: 14px;"><strong>Account No:</strong> 03000000000</p>
                <p style="margin: 5px 0; font-size: 14px;"><strong>Account Title:</strong> EarnPro Admin</p>
            </div>

            <div style="text-align: left;">
                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Amount (PKR)</label>
                <input type="number" id="depAmount" placeholder="Enter amount (e.g. 500, 1000)">

                <label style="font-size: 12px; color: #38bdf8; margin-left: 5px;">Transaction ID (TrxID)</label>
                <input type="text" id="depTrx" placeholder="Enter 11-digit Transaction ID">
            </div>

            <button id="depBtn" onclick="submitDeposit()" style="margin-top: 20px; background: #38bdf8; color: #0f172a; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer;">
                Submit Request
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsUq4BEYktF7gTHMB3zaJNX-ugdPVTfoo",
            authDomain: "earnpro-14953.firebaseapp.com",
            databaseURL: "https://earnpro-14953-default-rtdb.firebaseio.com",
            projectId: "earnpro-14953",
            storageBucket: "earnpro-14953.firebasestorage.app",
            messagingSenderId: "754662452601",
            appId: "1:754662452601:web:0548a7ee79ffafc63f13a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const phone = localStorage.getItem("currentUser");

        window.submitDeposit = function() {
            const amount = document.getElementById("depAmount").value.trim();
            const trx = document.getElementById("depTrx").value.trim();
            const btn = document.getElementById("depBtn");

            if(!phone) {
                alert("Pehle login karein!");
                window.location.href = 'login.html';
                return;
            }

            if(!amount || !trx) {
                alert("Jani, Amount aur Transaction ID likhna zaroori hai!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Submitting...";

            // Deposits requests node for admin panel
            const depRef = ref(db, 'deposits');
            const newDepRef = push(depRef);
            
            const timestamp = new Date().toLocaleString();

            set(newDepRef, {
                phone: phone,
                amount: parseInt(amount),
                trxId: trx,
                status: "Pending",
                time: timestamp
            }).then(() => {
                // User ki personal history node mein save karna
                const userHistoryRef = ref(db, 'history/' + phone + '/' + newDepRef.key);
                set(userHistoryRef, {
                    type: "Deposit",
                    amount: parseInt(amount),
                    trxId: trx,
                    status: "Pending",
                    time: timestamp
                }).then(() => {
                    alert("Deposit request submit ho gayi hai! Admin 30 minutes mein check karke plan active kar dega.");
                    window.location.href = 'history.html'; // Request ke baad automatic history page par redirection
                });
            }).catch((err) => {
                alert("Error: " + err.message);
                btn.disabled = false;
                btn.innerHTML = "Submit Request";
            });
        }
    </script>
</body>
    </html>
